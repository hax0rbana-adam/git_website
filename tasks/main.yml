# This role is expected to run as root so it can install system-wide packages
# and switch to the correct user before checking out the repo
- name: Install dependencies
  ansible.builtin.package:
    name:
      - git

- name: Ensuring the wwwroot directory exists with the right ownership & mode
  ansible.builtin.file:
    path: "{{ git_website_wwwroot }}"
    state: directory
    mode: "{{ git_website_wwwroot_mode }}"
    owner: "{{ git_website_user }}"
    group: "{{ git_website_group }}"
  vars:
    ansible_remote_tmp: /tmp

- name: Making sure we have the latest version of the code
  become: true
  become_user: "{{ git_website_user }}"
  ansible.builtin.git:
    dest: "{{ git_website_wwwroot }}"
    repo: '{{ git_website_repo }}'
    force: true  # overwrite any changes made manually
    single_branch: true  # checkout faster
    version: '{{ git_website_version }}'
